# SPDX-License-Identifier: GPL-3.0-or-later
#
# Push Verification: every push to main (as openQ4's push-verification.yml).
# Runs the 'push' profile of tools/validation/openetqw_validate.py on each
# platform the release ships, then publishes each staged payload (the tree
# `meson install` stages: binaries, game module, base/vkprogs, licences) as a
# workflow artifact, so every main commit has a downloadable engine build.
#
# One macOS build per architecture, the Vulkan one (MoltenVK over Metal); the
# Intel leg keeps the x64 slice building for the universal2 candidate
# (macos-universal2-candidate.yml). Pull requests run commit-validation.yml.
#
# Companion policy, retail data and experimental legs: as commit-validation.yml.

name: Push Verification

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      companion_ref:
        description: "openETQW-game full commit SHA, branch or tag to build against instead of tools/ci/companion.ref (empty: use the pin)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: openetqw-push-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  MESON_VERSION: "1.12.1"
  NINJA_VERSION: "1.13.2"
  PYFLAKES_VERSION: "4.0.0"
  SDL3_TAG: release-3.4.16
  OPENETQW_COMPANION_REPO: jm2/openETQW-game

jobs:
  script-smoke:
    name: Script smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pyflakes
        run: python -m pip install "pyflakes==${PYFLAKES_VERSION}"

      - name: Python syntax and pyflakes, include case, Zero-SDK, integration skips
        run: |
          set -euo pipefail
          python tools/ci/check_python.py
          python tools/ci/check_include_case.py
          python tests/test_zero_sdk.py
          python tools/ci/check_integration_skips.py --output-dir .tmp/ci/integration-skips

      - name: Dry-run the push profile
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/openETQW-game"
          touch "${RUNNER_TEMP}/openETQW-game/meson.build"
          python tools/validation/openetqw_validate.py push --dry-run --game-repo "${RUNNER_TEMP}/openETQW-game"

  verify:
    name: ${{ matrix.name }} Push Verification
    needs: script-smoke
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-x64
            name: Linux x64
            os: ubuntu-24.04
            platform: linux
            cc: gcc
            cxx: g++
            vcpkg_triplet: ""
            experimental: true
            blocker: "never run on a hosted runner; built and tested locally on Fedora 44 (GCC 16) only"
          - id: linux-arm64
            name: Linux ARM64
            os: ubuntu-24.04-arm
            platform: linux
            cc: gcc
            cxx: g++
            vcpkg_triplet: ""
            experimental: true
            blocker: "the Linux ARM64 engine build has never compiled"
          - id: macos-arm64
            name: macOS arm64 (Vulkan/MoltenVK)
            os: macos-15
            platform: macos
            cc: clang
            cxx: clang++
            vcpkg_triplet: ""
            experimental: true
            blocker: "the install and staged-payload steps are new and have not run on macOS"
          - id: macos-x64
            name: macOS Intel x64 (Vulkan/MoltenVK)
            os: macos-15-intel
            platform: macos
            cc: clang
            cxx: clang++
            vcpkg_triplet: ""
            experimental: true
            blocker: "the install and staged-payload steps are new and have not run on macOS"
          - id: windows-x64
            name: Windows x64
            os: windows-2025-vs2026
            platform: windows
            cc: cl
            cxx: cl
            vcpkg_triplet: x64-windows
            experimental: true
            blocker: "never run on a hosted runner; built and tested locally with VS 2026 (MSVC 19.51) only"
          - id: windows-arm64
            name: Windows ARM64
            os: windows-11-arm
            platform: windows
            cc: cl
            cxx: cl
            vcpkg_triplet: arm64-windows
            experimental: true
            blocker: "the Windows ARM64 engine build has never compiled (x64 builds locally with VS 2026)"
    env:
      OPENETQW_GAME_REPO: ${{ github.workspace }}/openETQW-game
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      LEG: ${{ matrix.name }}
    defaults:
      run:
        shell: bash
        working-directory: openETQW
    steps:
      - name: Checkout openETQW
        uses: actions/checkout@v7
        with:
          path: openETQW
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Prepare build (companion, Meson, dependencies)
        id: prepare
        uses: ./openETQW/.github/actions/prepare
        with:
          platform: ${{ matrix.platform }}
          vcpkg-triplet: ${{ matrix.vcpkg_triplet }}
          companion-ref: ${{ inputs.companion_ref }}
          cross-repo-token: ${{ secrets.OPENETQW_CROSS_REPO_TOKEN }}
          companion-required: ${{ vars.OPENETQW_COMPANION_REQUIRED }}
          repository-private: ${{ github.event.repository.private }}
          meson-version: ${{ env.MESON_VERSION }}
          ninja-version: ${{ env.NINJA_VERSION }}
          sdl3-tag: ${{ env.SDL3_TAG }}

      - name: Validate (push profile)
        if: steps.prepare.outputs.available == 'true'
        run: python tools/validation/openetqw_validate.py push --build-dir build --fail-on-dirty

      - name: Note experimental leg failure
        if: ${{ failure() && matrix.experimental }}
        env:
          BLOCKER: ${{ matrix.blocker }}
        working-directory: .
        run: |
          echo "::warning title=Experimental leg failed::${LEG} failed; this leg is experimental and does not fail the run. Known blocker: ${BLOCKER}"
          {
            echo "### ${LEG}: failed (experimental, does not fail the run)"
            echo "Known blocker: ${BLOCKER}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish staged payload
        if: steps.prepare.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: push-${{ matrix.id }}-payload
          path: openETQW/build/install
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: push-${{ matrix.id }}-logs
          path: |
            openETQW/build/meson-logs
            openETQW-game/build/meson-logs
            openETQW/.tmp/ci
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true
