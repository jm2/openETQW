#
# Announce a release on Discord when it is published (as openQ4's
# discord-release.yml). Only "published": GitHub never fires it for a draft,
# and a release published by manual-release.yml with the workflow token does
# not fire it either (that workflow announces its own). Publishing a draft by
# hand later fires it once. Without the DISCORD_RELEASE_WEBHOOK secret the job
# prints a notice and succeeds.

name: Broadcast Release To Discord

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  announce:
    name: Announce on Discord
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Send release embed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          DISCORD_RELEASE_MENTIONS: ${{ vars.DISCORD_RELEASE_MENTIONS }}
          DISCORD_RELEASE_AVATAR_URL: ${{ vars.DISCORD_RELEASE_AVATAR_URL }}
        run: python tools/build/announce_release_discord.py
