#
# Meson cross file: Linux ARM64 (aarch64) from an x86_64 Ubuntu 24.04 host with
# the gcc-aarch64-linux-gnu toolchain and arm64 multiarch packages
# (tools/ci/linux_deps.sh <SDL3_TAG> arm64; .github/workflows/linux-arm64-cross.yml).
# SDL3 comes from the private prefix linux_deps.sh builds: pass its pkg-config
# directory with -Dpkg_config_path=<prefix>/lib/pkgconfig (the environment's
# PKG_CONFIG_PATH applies to the build machine only in a cross build).

[binaries]
c = 'aarch64-linux-gnu-gcc'
cpp = 'aarch64-linux-gnu-g++'
ar = 'aarch64-linux-gnu-ar'
strip = 'aarch64-linux-gnu-strip'
objcopy = 'aarch64-linux-gnu-objcopy'
pkg-config = 'pkg-config'

[properties]
pkg_config_libdir = ['/usr/lib/aarch64-linux-gnu/pkgconfig', '/usr/share/pkgconfig']

[host_machine]
system = 'linux'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
